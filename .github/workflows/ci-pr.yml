name: CI Pull Request Gate

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Pull Request Quality Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recova_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recova_ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recova_ci_test?sslmode=disable
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recova_ci_test?sslmode=disable
      RECOVA_DB_INTEGRATION_URL: postgresql://postgres:postgres@localhost:5432/recova_ci_test?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go runtime
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Static analysis (lint)
        run: go vet ./...

      - name: OpenAPI drift check
        run: make openapi-check

      - name: Setup migrate CLI
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin migrate
          sudo chmod +x /usr/local/bin/migrate

      - name: Run database migrations
        run: make migrate-up

      - name: Seed test database fixtures
        run: make seed

      - name: Run test suite
        run: go test -p 1 ./...

      - name: Verify binary build
        run: make build
