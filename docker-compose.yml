# ==============================================================================
# Recova Backend Production Standalone Compose Orchestration
# ==============================================================================

name: ${COMPOSE_PROJECT_NAME:-recova}

services:
  # ----------------------------------------------------------------------------
  # Recova REST API Service (Go / Fiber)
  # ----------------------------------------------------------------------------
  api:
    image: ${API_IMAGE:-ghcr.io/recova-app/backend-v2:${IMAGE_TAG:-main}}
    container_name: recova-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3001}
    # Ingress binding: Binds strictly to localhost (127.0.0.1) on the host for Nginx reverse proxy
    # Zero public port exposure; public traffic routes through Cloudflare Tunnel -> Nginx -> 127.0.0.1:3001
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3001}:${PORT:-3001}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-3001}/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.10"
