services:
  api:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-.env.staging}
    environment:
      APP_ENV: ${APP_ENV:-staging}
      PORT: ${PORT:-3001}
    ports:
      - "${APP_PORT:-3001}:${PORT:-3001}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-3001}/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
