components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookieAuth:
      type: apiKey
      in: cookie
      name: recova_refresh
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          type: object
          additionalProperties: true
        meta:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
    ErrorEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - error
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ErrorPayload'
    ErrorPayload:
      type: object
      required:
        - code
        - requestId
      properties:
        code:
          type: string
        details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: 'null'
        requestId:
          type: string
    AuthGoogleLoginRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
    OnboardingRequest:
      type: object
      required:
        - nickname
        - recovery_reason
        - daily_checkin_time
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 50
        recovery_reason:
          type: string
          minLength: 3
        daily_checkin_time:
          type: string
          pattern: '^([01]\\d|2[0-3]):([0-5]\\d)$'
        answers:
          type: object
          additionalProperties: true
        dependency_level:
          type: string
        userWhy:
          type: string
        checkinTime:
          type: string
        dependencyLevel:
          type: string
    UserSettingsUpdateRequest:
      type: object
      minProperties: 1
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 50
        recovery_reason:
          type: string
          minLength: 3
        daily_checkin_time:
          type: string
          pattern: '^([01]\\d|2[0-3]):([0-5]\\d)$'
        userWhy:
          type: string
        checkinTime:
          type: string
    RoutineCheckInRequest:
      type: object
      required:
        - mood
        - isSuccessful
      properties:
        mood:
          type: string
          minLength: 1
          maxLength: 50
        isSuccessful:
          type: boolean
        commitment:
          type: string
          maxLength: 2000
        content:
          type: string
          maxLength: 2000
    JournalCreateRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
    CommunityCategory:
      type: string
      enum:
        - saran
        - motivasi
        - cerita
        - pertanyaan
        - bantuan
    CommunityCreatePostRequest:
      type: object
      required:
        - content
        - category
      properties:
        title:
          type: string
          maxLength: 120
        content:
          type: string
          minLength: 10
          maxLength: 5000
        category:
          $ref: '#/components/schemas/CommunityCategory'
    CommunityCreateCommentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
    AchievementsCategory:
      type: string
      enum:
        - streak_milestone
        - checkin_consistency
        - journal_consistency
        - relapse_recovery
        - community_participation
        - onboarding_completion
    AIAskCoachRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
    AIOnboardingAnalysisRequest:
      type: object
      required:
        - answers
      properties:
        answers:
          type: object
          minProperties: 1
          additionalProperties: true
    AIPersonaPreferenceRequest:
      type: object
      required:
        - persona
      properties:
        persona:
          type: string
          enum:
            - supportive
            - friendly
            - concise
            - direct
security: []
