      summary: Get user check-in statistics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Routine statistics fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Access token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/routine/statistics/activity-summary:
    get:
      tags:
        - routine
      operationId: getRoutineActivitySummary
      summary: Get periodic user activity summary
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: windowDays
          required: false
          schema:
            type: integer
            minimum: 7
            maximum: 90
      responses:
        '200':
          description: Activity summary fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Access token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: windowDays value is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/routine/relapses:
    get:
      tags:
