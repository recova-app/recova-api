      tags:
        - ai
      operationId: getAIPersonaPreference
      summary: Get user AI persona preference
      security:
        - BearerAuth: []
      responses:
        '200':
          description: AI persona preference fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Access token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
