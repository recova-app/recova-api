openapi: 3.1.0
info:
  title: Recova Backend API
  version: 0.2.0
  description: Kontrak API publik runtime Go Fiber Recova Backend.
servers:
  - url: /
    description: Base URL runtime service
paths:
  /health/live:
    get:
      tags:
        - health
      operationId: getHealthLive
      summary: Memeriksa status liveness layanan
      responses:
        '200':
          description: Layanan aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Layanan aktif
                    data:
                      status: ok
                    meta: null
  /health/ready:
    get:
      tags:
        - health
      operationId: getHealthReady
      summary: Memeriksa readiness dependency layanan
      responses:
        '200':
          description: Layanan siap menerima request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                ready:
                  value:
                    success: true
                    message: Layanan siap
                    data:
                      status: ready
                      checks:
                        database:
                          status: ok
                          healthy: true
                          message: Koneksi database sehat
                    meta: null
        '503':
          description: Layanan belum siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /metrics:
    get:
      tags:
        - observability
      operationId: getMetrics
      summary: Mengekspos metrik runtime format Prometheus
      responses:
        '200':
          description: Metrics runtime dalam format text/plain
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/google:
    post:
      tags:
        - auth
      operationId: postAuthGoogle
      summary: Login atau registrasi pengguna via Google token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthGoogleLoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token Google tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/onboarding:
    post:
      tags:
        - onboarding
      operationId: postAuthOnboarding
      summary: Menyimpan data onboarding awal pengguna
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '201':
          description: Data onboarding berhasil disimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Onboarding sudah selesai dengan data berbeda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload onboarding tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      operationId: postAuthRefresh
      summary: Merotasi refresh token dan menerbitkan access token baru
      security:
        - RefreshCookieAuth: []
      responses:
        '200':
          description: Sesi berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Refresh token tidak valid atau kadaluarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout:
    post:
      tags:
        - auth
      operationId: postAuthLogout
      summary: Mengakhiri sesi pengguna saat ini
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/users/me:
    get:
      tags:
        - users
      operationId: getUsersMe
      summary: Mengambil profil pengguna saat ini
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil pengguna berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/users/settings:
    put:
      tags:
        - users
      operationId: putUsersSettings
      summary: Memperbarui pengaturan profil pengguna
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsUpdateRequest'
      responses:
        '200':
          description: Pengaturan pengguna berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload update tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/users/me/reset-data:
    delete:
      tags:
        - users
      operationId: deleteUsersMeResetData
      summary: Mereset data pengguna untuk kebutuhan development
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Data pengguna berhasil direset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Endpoint reset tidak diizinkan pada environment ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/routine/checkin:
    post:
      tags:
        - routine
      operationId: postRoutineCheckin
      summary: Menyimpan check-in harian pengguna
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineCheckInRequest'
      responses:
        '200':
          description: Check-in harian berhasil disimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Pengguna sudah check-in pada hari UTC yang sama
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload check-in tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/routine/statistics:
    get:
      tags:
        - routine
      operationId: getRoutineStatistics
      summary: Mengambil statistik check-in pengguna
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Statistik rutin berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/routine/statistics/activity-summary:
    get:
      tags:
        - routine
      operationId: getRoutineActivitySummary
      summary: Mengambil ringkasan aktivitas periodik pengguna
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: windowDays
          required: false
          schema:
            type: integer
            minimum: 7
            maximum: 90
      responses:
        '200':
          description: Ringkasan aktivitas berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Nilai windowDays tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/routine/relapses:
    get:
      tags:
        - routine
      operationId: getRoutineRelapses
      summary: Mengambil riwayat relapse pengguna
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Riwayat relapse berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/journals:
    get:
      tags:
        - journals
      operationId: getJournals
      summary: Mengambil daftar jurnal milik pengguna
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar jurnal berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags:
        - journals
      operationId: postJournals
      summary: Membuat entri jurnal pengguna
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalCreateRequest'
      responses:
        '201':
          description: Entri jurnal berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload jurnal tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/community:
    get:
      tags:
        - community
      operationId: getCommunityPosts
      summary: Mengambil daftar postingan komunitas
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: category
          required: false
          schema:
            $ref: '#/components/schemas/CommunityCategory'
      responses:
        '200':
          description: Daftar postingan komunitas berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Query kategori tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags:
        - community
      operationId: postCommunity
      summary: Membuat postingan komunitas
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityCreatePostRequest'
      responses:
        '201':
          description: Postingan komunitas berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload postingan tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Permintaan write community melebihi limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/community/{postId}/comments:
    get:
      tags:
        - community
      operationId: getCommunityCommentThread
      summary: Mengambil thread komentar pada postingan komunitas
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Thread komentar berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Query komentar tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags:
        - community
      operationId: postCommunityComment
      summary: Menambahkan komentar ke postingan komunitas
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityCreateCommentRequest'
      responses:
        '201':
          description: Komentar berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Postingan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload komentar tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Permintaan write community melebihi limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/community/{postId}/comments/{commentId}/replies:
    post:
      tags:
        - community
      operationId: postCommunityCommentReply
      summary: Menambahkan balasan pada komentar komunitas
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
        - in: path
          name: commentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityCreateCommentRequest'
      responses:
        '201':
          description: Balasan komentar berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Postingan atau komentar parent tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload balasan atau depth thread tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Permintaan write community melebihi limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/community/{postId}/like:
    post:
      tags:
        - community
      operationId: postCommunityLikeToggle
      summary: Toggle status suka pada postingan komunitas
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status suka postingan berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Postingan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Permintaan write community melebihi limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/achievements/catalog:
    get:
      tags:
        - achievements
      operationId: getAchievementsCatalog
      summary: Mengambil katalog achievement aktif
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: category
          required: false
          schema:
            $ref: '#/components/schemas/AchievementsCategory'
      responses:
        '200':
          description: Katalog achievement berhasil diambil
