          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Respons provider AI tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Provider AI tidak tersedia atau timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/ai/chat-history:
    get:
      tags:
        - ai
      operationId: getAIChatHistory
      summary: Mengambil riwayat chat AI milik pengguna
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Riwayat chat AI berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Nilai query tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Permintaan AI melebihi limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/ai/summary:
    get:
      tags:
        - ai
      operationId: getAISummary
      summary: Mengambil ringkasan AI pengguna saat ini
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Ringkasan AI berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Permintaan AI melebihi limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/ai/onboarding-analysis:
    post:
      tags:
        - ai
      operationId: postAIOnboardingAnalysis
      summary: Menganalisis jawaban onboarding menggunakan AI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIOnboardingAnalysisRequest'
      responses:
        '200':
          description: Analisis onboarding berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload onboarding-analysis tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Permintaan AI melebihi limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Respons analisis provider AI tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Provider AI tidak tersedia atau timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/ai/persona-preferences:
    get:
      tags:
        - ai
      operationId: getAIPersonaPreference
      summary: Mengambil preferensi persona AI pengguna
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Preferensi persona AI berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Permintaan AI melebihi limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags:
        - ai
      operationId: putAIPersonaPreference
      summary: Memperbarui preferensi persona AI pengguna
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIPersonaPreferenceRequest'
      responses:
        '200':
          description: Preferensi persona AI berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Nilai persona tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Permintaan AI melebihi limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookieAuth:
      type: apiKey
      in: cookie
      name: recova_refresh
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          type: object
          additionalProperties: true
        meta:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
    ErrorEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - error
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ErrorPayload'
    ErrorPayload:
      type: object
      required:
        - code
        - requestId
      properties:
        code:
          type: string
        details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: 'null'
        requestId:
          type: string
    AuthGoogleLoginRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
    OnboardingRequest:
      type: object
      required:
        - nickname
        - recovery_reason
        - daily_checkin_time
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 50
        recovery_reason:
          type: string
          minLength: 3
        daily_checkin_time:
          type: string
          pattern: '^([01]\\d|2[0-3]):([0-5]\\d)$'
        answers:
          type: object
          additionalProperties: true
        dependency_level:
          type: string
        userWhy:
          type: string
        checkinTime:
          type: string
        dependencyLevel:
          type: string
    UserSettingsUpdateRequest:
      type: object
      minProperties: 1
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 50
        recovery_reason:
          type: string
          minLength: 3
        daily_checkin_time:
          type: string
          pattern: '^([01]\\d|2[0-3]):([0-5]\\d)$'
        userWhy:
          type: string
        checkinTime:
          type: string
    RoutineCheckInRequest:
      type: object
      required:
        - mood
        - isSuccessful
      properties:
        mood:
          type: string
          minLength: 1
          maxLength: 50
        isSuccessful:
          type: boolean
        commitment:
          type: string
          maxLength: 2000
        content:
          type: string
          maxLength: 2000
    JournalCreateRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
    CommunityCategory:
      type: string
      enum:
        - advice
        - motivation
        - story
        - question
        - assistance
    CommunityCreatePostRequest:
      type: object
      required:
        - content
        - category
      properties:
        title:
          type: string
          maxLength: 120
        content:
          type: string
          minLength: 10
          maxLength: 5000
        category:
          $ref: '#/components/schemas/CommunityCategory'
    CommunityCreateCommentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
    AchievementsCategory:
      type: string
      enum:
        - streak_milestone
        - checkin_consistency
        - journal_consistency
        - relapse_recovery
        - community_participation
        - onboarding_completion
    AIAskCoachRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
    AIOnboardingAnalysisRequest:
      type: object
      required:
        - answers
      properties:
        answers:
          type: object
          minProperties: 1
          additionalProperties: true
    AIPersonaPreferenceRequest:
      type: object
      required:
        - persona
      properties:
        persona:
          type: string
          enum:
            - supportive
            - friendly
            - concise
            - direct
security: []
