          required: false
          schema:
            $ref: '#/components/schemas/AchievementsCategory'
      responses:
        '200':
          description: Progres achievement berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Filter kategori tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/achievements/unlocked:
    get:
      tags:
        - achievements
      operationId: getAchievementsUnlocked
      summary: Mengambil daftar achievement yang sudah terbuka
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: category
          required: false
          schema:
            $ref: '#/components/schemas/AchievementsCategory'
      responses:
        '200':
          description: Daftar achievement terbuka berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Filter kategori tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/education:
    get:
      tags:
        - education
      operationId: getEducation
      summary: Mengambil daftar konten edukasi aktif
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Konten edukasi berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Token akses tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/content/daily:
    get:
      tags:
        - content
      operationId: getDailyContent
      summary: Mengambil konten motivasi dan tantangan harian
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Konten harian berhasil diambil
          content:
            application/json:
