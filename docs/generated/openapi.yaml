              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Invalid AI provider analysis response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: AI provider unavailable or timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
