# ==============================================================================
# Recova Backend — Nginx Host Virtual Host Configuration
# ==============================================================================
# Reverse proxy for Recova Go/Fiber API (running on 127.0.0.1:3001).
# Placed at /etc/nginx/sites-available/recova.conf and symlinked to sites-enabled.
# Global directives (Real-IP, WebSocket map, catch-all) reside in /etc/nginx/conf.d/.
# ==============================================================================

upstream recova_api {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP (Port 80) — Canonical Redirect to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name recova.example.com; # Sesuaikan dengan domain produksi anda

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) — Reverse Proxy to Recova API
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name recova.example.com; # Sesuaikan dengan domain produksi anda

    # SSL Certificates: Cloudflare Origin CA Certificate atau Let's Encrypt
    ssl_certificate     /etc/ssl/certs/recova.pem;
    ssl_certificate_key /etc/ssl/private/recova.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers Hardening
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Payload limits
    client_max_body_size 10M;

    # Gzip Compression for JSON & OpenAPI responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/yaml
        text/yaml;

    # --------------------------------------------------------------------------
    # OpenAPI Documentation & Swagger / Scalar Artifacts
    # --------------------------------------------------------------------------
    location ~* ^/(docs|openapi\.yaml) {
        include snippets/proxy-params.conf;
        proxy_pass http://recova_api;
    }

    # --------------------------------------------------------------------------
    # Health Probes
    # --------------------------------------------------------------------------
    location ^~ /health/ {
        include snippets/proxy-params.conf;
        proxy_pass http://recova_api;
    }

    # --------------------------------------------------------------------------
    # Core API Ingress
    # --------------------------------------------------------------------------
    location / {
        include snippets/proxy-params.conf;
        proxy_pass http://recova_api;
    }
}
